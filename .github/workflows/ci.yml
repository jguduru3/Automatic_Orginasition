name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit, integration and concurrency tests (Testcontainers Postgres)
        working-directory: backend
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-reports, path: backend/target/surefire-reports }

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dos }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: dos }
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and demo seed
        run: for f in backend/src/main/resources/db/migration/*.sql backend/src/main/resources/db/demo/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: PREPARE every SQL statement in the Java code
        run: python3 tools/check_sql.py backend/src/main/java "postgresql://postgres:postgres@localhost/dos"
      - name: Concurrency stress on stock, numbering and payments (pgbench)
        run: bash load-tests/pgbench/run.sh

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-and-load:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (Postgres, Azurite, API, web)
        run: LOGIN_RATE_LIMIT=10000 docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Playwright end-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npx playwright test
      - uses: grafana/setup-k6-action@v1
      - name: Stress test every endpoint
        run: |
          for s in load-tests/k6/*.js; do
            echo "::group::$s"; k6 run -e BASE_URL=http://localhost:8080 "$s"; echo "::endgroup::"
          done
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color api | tail -300
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report }
